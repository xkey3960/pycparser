[pytest]
# 统一测试入口：仓库根执行 `pytest` 跑完全部测试
#   - test_*.py   ：本地解释器测试（M0-M5 + S1-S4 + L1-L4 + 指针/类型/堆/
#                   错误回溯/static/StaticAssert/方案C/Goto/setjmp/QOL-1~4 + GNU 扩展 + 端到端）
#                   + 持锁调用静态分析（LOCK-CHECK）
#   - tests/      ：上游 pycparser 官方测试
testpaths = test_typesys.py test_program.py test_builtins.py test_qol2.py test_qol4.py test_lockcheck.py test_exe.py test_ext.py test_print_pointer.py tests

# 云盘锁目录（pytest-cache-files-*）Permission denied 噪音 → 禁用缓存提供者；
# -s 显示测试内 print 输出（测试用 print 汇报进度）
addopts = -p no:cacheprovider -q -s
