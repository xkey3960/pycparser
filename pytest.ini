[pytest]
# 统一测试入口：仓库根执行 `pytest` 跑完全部**现役**测试
#   - super_execute/tests：新实现（clean architecture）
#   - tests/            ：上游 pycparser 官方测试（解析器本体）
#   - test_ext.py       ：GNU 扩展解析端到端（只依赖 pycparser + pycparserext）
#   - test_lockcheck.py ：持锁调用静态分析（独立工具，与被替换的解释器无关）
#
# 旧解释器（execute.py / typesys.py / program.py / sources.py / cbuiltins.py）
# 已经下线，连同它的测试一起归档到 archive/。那批测试现在可以跑在**新实现**上：
#     py super_execute/compat/run_legacy_tests.py
testpaths = test_lockcheck.py test_ext.py tests super_execute/tests

# archive/ 里的旧代码与旧测试不参与常规收集（它们依赖已下线的模块）
norecursedirs = archive

# 云盘锁目录（pytest-cache-files-*）Permission denied 噪音 → 禁用缓存提供者；
# -s 显示测试内 print 输出（测试用 print 汇报进度）
addopts = -p no:cacheprovider -q -s
